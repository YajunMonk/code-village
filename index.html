<style>

#touch[hidden] { display: none !important; }

#touch .d { width: var(--key); height: var(--key); border-radius: 10px; }
#touch [data-k=up] { left: calc(var(--edge) + env(safe-area-inset-left) + var(--step)); bottom: calc(var(--base) + env(safe-area-inset-bottom) + var(--step) + var(--step)); }
#touch [data-k=down] { left: calc(var(--edge) + env(safe-area-inset-left) + var(--step)); bottom: calc(var(--base) + env(safe-area-inset-bottom)); }
#touch [data-k=left] { left: calc(var(--edge) + env(safe-area-inset-left)); bottom: calc(var(--base) + env(safe-area-inset-bottom) + var(--step)); }
#touch [data-k=right] { left: calc(var(--edge) + env(safe-area-inset-left) + var(--step) + var(--step)); bottom: calc(var(--base) + env(safe-area-inset-bottom) + var(--step)); }
#touch [data-k=ok] { right: calc(var(--edge) + env(safe-area-inset-right)); bottom: calc(var(--base) + env(safe-area-inset-bottom) + 44px); width: var(--action); height: var(--action); border-radius: 50%; background: rgba(77,96,66,.6); color: #f5f3f0; font-size: 25px; }

  #touch:not([hidden])::after { content: ''; position: absolute; right: calc(var(--edge) + env(safe-area-inset-right) + var(--action) + 14px); bottom: calc(126px + var(--lift) + env(safe-area-inset-bottom)); width: 48px; height: 17px; background: radial-gradient(ellipse at center, #4f5d43 0 2px, #b3be9e 2px 3px, transparent 3px) 0 0 / 12px 8px; transform: rotate(-9deg); opacity: .85; }
  #touch button { border: 1px solid #0e1014; background: linear-gradient(145deg, #383b40, #202226 65%, #191b1f); color: #e6e7e5; text-shadow: 0 1px #08090c; box-shadow: 0 0 0 4px #5f6e50, 0 5px 0 4px #48583e, inset 0 1px 0 #595c60, inset 0 -3px 0 #101115, 0 8px 12px rgba(30,42,23,.4); }
  #touch .d { border-radius: 9px; }

.save-actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.save-actions .save-wide { grid-column: 1 / -1; }
.save-panel button { appearance: none; min-height: 44px; padding: 8px 12px; cursor: pointer; border: 1px solid #74928b; border-radius: 2px; color: #f3edda; background: linear-gradient(#254c53 0 48%, #1d3e46 48%); box-shadow: inset 0 1px 0 rgba(238,243,214,.1), 0 2px 0 #071b25; font: inherit; font-size: 16px; line-height: 1.4; touch-action: manipulation; }
.save-panel button:hover:not(:disabled) { border-color: #eed8a6; }
.save-panel button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.save-panel button:focus-visible, .save-preview:focus-visible { outline: 2px solid #f7d683; outline-offset: 4px; }
.save-panel button:disabled { opacity: .43; cursor: default; }
.save-panel button.save-primary { color: #243d38; background: linear-gradient(#f0dfb5 0 48%, #d8bd87 48%); border-color: #e8cf98; }
.save-panel button.save-close { min-width: 44px; width: 44px; padding: 0; font: 28px/1 system-ui, sans-serif; color: #d0dfd6; border-color: transparent; background: transparent; box-shadow: none; }
.save-help { margin-top: 13px; line-height: 1.65; }
.save-panel button.save-recovery { width: 100%; margin-top: 16px; font-size: 14px; background: transparent; border-color: #4a6a6a; color: #cfdbce; }
.save-preview { margin-top: 20px; padding: 17px; background: #193b40; border: 1px solid #a3a785; scroll-margin: 18px; outline: none; }
.save-preview h2 { color: #eed8a6; }
.save-file { margin-bottom: 13px; -webkit-user-select: text; user-select: text; }
.save-confirm-copy { margin: 14px 0; color: #e1dfc8; font-size: 14px; }
.save-preview .save-actions { grid-template-columns: 1fr auto; }
.save-preview .save-actions button { font-size: 14px; }
.save-status { min-height: 0; margin: 13px 0 0; color: #b6d9b0; font-size: 14px; -webkit-user-select: text; user-select: text; }
.save-status:empty { display: none; }
.save-status.is-error { color: #ffb9a5; }
.save-sound { margin-top: 22px; padding-top: 17px; border-top: 1px solid #39545a; }
.save-sound button { font-size: 14px; min-height: 42px; }
.save-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 26px; border-top: 1px solid #39545a; background: #0c242e; }
.save-footer span { font-size: 13px; color: #a8b9bd; }
.save-footer button { min-width: 100px; font-size: 14px; }
@media (max-width: 420px) { .save-overlay { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); } .save-header { padding: 17px 18px 14px; } .save-content { padding: 18px; } .save-footer { padding: 12px 18px; } .save-panel h1 { font-size: 24px; } .save-chapter { font-size: 20px; } .save-preview { padding: 13px; } }
@media (max-height: 450px) and (min-width: 600px) { .save-panel { width: min(100%, 650px); } .save-header { padding-top: 12px; padding-bottom: 10px; } .save-content { padding-top: 15px; } }
@media (prefers-reduced-motion: reduce) { #touch button { transition: none; } }
</style>
</head>

 * 20 美术：像素画笔、角色、生物
 * ============================================================ */
const OUTLINE = '#1a1222';
function spr(w, h, fn, { outline = true } = {}) {
  const buf = new Array(w * h).fill(null);
  const api = {
    w, h,
    P(x, y, c) { x = Math.round(x); y = Math.round(y); if (c && x >= 0 && y >= 0 && x < w && y < h) buf[y * w + x] = c; },
    R(x, y, ww, hh, c) { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) api.P(x + i, y + j, c); },
    E(cx, cy, rx, ry, c) { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) api.P(x, y, c); } },
    G(x, y) { return (x >= 0 && y >= 0 && x < w && y < h) ? buf[y * w + x] : null; },
    X(x, y) { if (x >= 0 && y >= 0 && x < w && y < h) buf[y * w + x] = null; },
    L(x0, y0, x1, y1, c) { x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (;;) { api.P(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } },
    // 在已有像素上做明暗：只改已经画了的像素
    T(x, y, c) { if (api.G(x, y)) api.P(x, y, c); },
  };
  fn(api);
  const pad = outline ? 1 : 0, W = w + pad * 2, H = h + pad * 2;
  const [c, x] = makeCanvas(W, H); const img = x.createImageData(W, H), d = img.data;
  const put = (px, py, col) => { const [r, g, b] = hex2rgb(col); const i = (py * W + px) * 4; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255; };
  for (let y = 0; y < h; y++) for (let x2 = 0; x2 < w; x2++) if (buf[y * w + x2]) put(x2 + pad, y + pad, buf[y * w + x2]);
  if (outline) {
    const g = (x2, y) => (x2 >= 0 && y >= 0 && x2 < w && y < h) ? buf[y * w + x2] : null;
    for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) {
      const bx = X - pad, by = Y - pad; if (g(bx, by)) continue;
      const n = g(bx, by + 1) || g(bx - 1, by) || g(bx + 1, by) || g(bx, by - 1);
      if (n) put(X, Y, mix(shade(n, .35), OUTLINE, .55));
    }
  }
  x.putImageData(img, 0, 0);
  return c;
}

/* ---------- 两头身角色：依照 buxiang-design.png 的原生像素复刻 ----------
 * 常规 24×34、儿童 24×32；头部主体 17px，肩窄、短手短腿。
 * 独立肖像由 UI 提供。这里只承担世界行走图，脚底世界锚点保持不变。

function drawPerson(o, dir, frame, talk = 0, blink = false) {

    const sleeve = (x, swing, front) => {

      R(x, by + 4 + swing, 3, 2, front ? sh[1] : sh[0]);

  g.fillStyle = '#342e60'; g.fillRect(x + 3, y + 3, s - 6, Math.round((s - 6) / 2));
  const k = Math.min((s - 8) / p.sw, (s - 8) / p.sh), dw = Math.round(p.sw * k), dh = Math.round(p.sh * k);

/* ---------- 对话 ---------- */
class DialogScreen extends Screen {
  constructor(lines) { super(); this.lines = lines; this.i = -1; this.next(); }
  layout() {
    const portrait = !!this.W, ps = PORTRAIT ? 46 : 52;
    const x = 6, w = VW - 12, tx = x + (portrait ? ps + 14 : 12), tw = w - (tx - x) - 12;
    const maxLines = PORTRAIT ? 5 : 3;
    const y = VH - (maxLines * LH + 20) - 6;
    return { x, y, w, h: maxLines * LH + 20, tx, tw, ps, maxLines, nameX: x + (this.reactionMarked ? 36 : 6), headerGap: this.reactionMarked ? 34 : portrait ? 18 : 6 };
  }
  next() {
    this.reaction = null;
    this.i++;
    if (this.i >= this.lines.length) { talkingWho = null; closeScreen(this); return; }
    const l = this.lines[this.i];
    let who = '', text = '', code = '', metadata = null;
    if (typeof l === 'string') text = l; else [who, text, code = '', metadata = null] = l;
    this.who = who; this.W = WHO[who]; this.code = code; this.text = text;
    this.reaction = makeReaction(who, metadata); this.reactionMarked = !!this.reaction;
    const L = this.layout();
    const all = wrap(text, L.tw, this.W ? UIC.text : '#d8d2ec');
    this.pages = []; for (let i = 0; i < all.length; i += L.maxLines) this.pages.push(all.slice(i, i + L.maxLines));
    this.page = 0; this.n = 0; this.acc = 0; this.total = countChars(this.pages[0]);
    this.wrapWidth = L.tw; this.wrapLines = L.maxLines;
    talkingWho = who;
  }
  reflow() {
    const L = this.layout();
    if (L.tw === this.wrapWidth && L.maxLines === this.wrapLines) return;
    // 旋转手机或改变窗口大小时，保留已经读到的位置，并按新行宽重新分页。
    let read = this.pages.slice(0, this.page).reduce((n, p) => n + countChars(p), 0) + this.n;
    const all = wrap(this.text, L.tw, this.W ? UIC.text : '#d8d2ec');
    this.pages = []; for (let i = 0; i < all.length; i += L.maxLines) this.pages.push(all.slice(i, i + L.maxLines));
    this.page = 0;
    while (this.page < this.pages.length - 1 && read > countChars(this.pages[this.page])) { read -= countChars(this.pages[this.page]); this.page++; }
    this.total = countChars(this.pages[this.page]); this.n = Math.min(read, this.total);
    this.wrapWidth = L.tw; this.wrapLines = L.maxLines;
  }
  update(dt) {
    this.reflow();
    if (this.reaction) { this.reaction.age += Math.max(0, Number.isFinite(dt) ? dt : 0); if (this.reaction.age >= this.reaction.duration) this.reaction = null; }
    this.t += dt;
    if (this.n < this.total) {
      this.acc += dt * 38; const k = Math.floor(this.acc);
      if (k > 0) { this.acc -= k; const b = this.n; this.n = Math.min(this.total, this.n + k); if (Math.floor(this.n / 2) !== Math.floor(b / 2)) Audio.sfx('blip', this.W ? this.W.v : 0); }
      talkingWho = this.who;
    } else talkingWho = null;
    const adv = Input.hit('ok') || Input.hit('back') || !!Input.pointer.click;
    if (adv) {
      if (this.n < this.total) this.n = this.total;
      else if (this.page < this.pages.length - 1) { this.page++; this.n = 0; this.acc = 0; this.total = countChars(this.pages[this.page]); }
      else { Audio.sfx('move'); this.next(); }
    }
  }
  draw(g) {
    this.reflow();
    const L = this.layout();
    if (this.code) {
      const m = measureCode(this.code, VW - 12);
      codeBox(g, this.code, Math.round((VW - m.w) / 2), L.y - m.h - L.headerGap, VW - 12);
    }
    win(g, L.x, L.y, L.w, L.h, 'dlg');
    if (this.W) {
      drawPortrait(g, this.W.id, L.x + 7, L.y + Math.round((L.h - L.ps) / 2), L.ps, this.n < this.total && Math.floor(this.t * 8) % 2);
      const nw = textW(this.W.n) + 16;
      win(g, L.nameX, L.y - 14, nw, 18, 'gold');
      txt(g, this.W.n, L.nameX + 8, L.y - 11, this.W.c);
    }
    drawLines(g, this.pages[this.page], L.tx, L.y + 9, { max: this.n });
    if (this.n >= this.total) { const b = Math.floor(this.t * 3) % 2; g.fillStyle = UIC.gold; const ax = L.x + L.w - 14, ay = L.y + L.h - 10 + b; g.fillRect(ax, ay, 7, 1); g.fillRect(ax + 1, ay + 1, 5, 1); g.fillRect(ax + 2, ay + 2, 3, 1); g.fillRect(ax + 3, ay + 3, 1, 1); }
    drawReaction(g, this, L);
  }
  onClose() { this.reaction = null; if (talkingWho === this.who) talkingWho = null; }
}

const toasts = [];
function toast(text, c = UIC.gold) { toasts.push({ text, c, t: 0 }); }
function drawToasts(g, dt) {
  const T0 = toasts[0]; if (!T0) return;
  T0.t += dt; const life = 2.6;
  const a = T0.t < .2 ? T0.t / .2 : T0.t > life - .3 ? (life - T0.t) / .3 : 1;
  const w = textW(T0.text) + 20, x = Math.round((VW - w) / 2), y = Math.round(28 + (1 - easeOut(Math.min(1, T0.t * 4))) * -10);

}

/* ---------- 转场 ---------- */
const fx = { fade: 0, fadeC: '#000000', flash: 0, flashC: '#ffffff', shake: 0 };
function fadeTo(target, dur = .5, color = '#000000') {
  fx.fadeC = color;
  return new Promise(res => { const from = fx.fade, t0 = performance.now(); const step = () => { const k = Math.min(1, (performance.now() - t0) / (dur * 1000)); fx.fade = lerp(from, target, k); if (k < 1) requestAnimationFrame(step); else res(); }; step(); });
}
function flash(c = '#ffffff', a = 1) { fx.flashC = c; fx.flash = a; }
function shake(a = 4) { fx.shake = Math.max(fx.shake, a); }

/* ---------- 大标题 Logo ---------- */
let LOGO = null;
function makeLogo(text, scale) {
  const w = textW(text) + 4, h = 16;
  const [a, ax] = makeCanvas(w, h); ax.font = FONT; ax.textBaseline = 'alphabetic'; ax.fillStyle = '#fff'; ax.fillText(text, 2, 12);
  // 二值化，去掉抗锯齿
  const id = ax.getImageData(0, 0, w, h); for (let i = 3; i < id.data.length; i += 4) id.data[i] = id.data[i] > 100 ? 255 : 0; ax.putImageData(id, 0, 0);
  const W = w * scale + 8, H = h * scale + 10;
  const [c, x] = makeCanvas(W, H);
  const big = (dx, dy) => x.drawImage(a, 0, 0, w, h, 4 + dx, 4 + dy, w * scale, h * scale);
  // 阴影与描边
  x.globalAlpha = 1;
  const [tint, tx] = makeCanvas(W, H);
  const solidCopy = col => { tx.clearRect(0, 0, W, H); tx.globalCompositeOperation = 'source-over'; tx.drawImage(a, 0, 0, w, h, 4, 4, w * scale, h * scale); tx.globalCompositeOperation = 'source-in'; tx.fillStyle = col; tx.fillRect(0, 0, W, H); return tint; };
  const sh = solidCopy('#1a1222'); for (const [dx, dy] of [[0, 4], [2, 4], [-2, 4], [0, 5]]) x.drawImage(sh, dx, dy);
  const ol = solidCopy('#132e36'); for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [-2, -2], [2, 2], [-2, 2], [2, -2]]) x.drawImage(ol, dx, dy);
  const ol2 = solidCopy('#6d8b87'); for (const [dx, dy] of [[0, 2], [1, 2], [-1, 2]]) x.drawImage(ol2, dx, dy);
  // 渐变填充
  tx.clearRect(0, 0, W, H); tx.globalCompositeOperation = 'source-over'; tx.drawImage(a, 0, 0, w, h, 4, 4, w * scale, h * scale); tx.globalCompositeOperation = 'source-in';
  const gr = tx.createLinearGradient(0, 4, 0, 4 + 12 * scale); gr.addColorStop(0, '#fff8de'); gr.addColorStop(.45, '#f1e5c5'); gr.addColorStop(.5, '#d4d9bb'); gr.addColorStop(1, '#b3cec0');
  tx.fillStyle = gr; tx.fillRect(0, 0, W, H);
  x.drawImage(tint, 0, 0);
  // 高光
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(255,255,255,.55)'; for (let yy = 4 + scale; yy < 4 + scale * 3; yy += scale) x.fillRect(0, yy, W, Math.max(1, scale / 3 | 0)); x.globalCompositeOperation = 'source-over';
  void big;
  return c;
}

function loadArt(key) {
  if(ART[key])return Promise.resolve(true);
  if(ART_STATUS.pending.has(key))return ART_STATUS.pending.get(key);
  if(!ASSET_DATA[key]){if(!ART_STATUS.errors.includes(key))ART_STATUS.errors.push(key);return Promise.resolve(false);}
  const work=new Promise(resolve=>{
    const im=new Image();let finished=false;
    const finish=ok=>{if(finished)return;finished=true;clearTimeout(timer);
      if(ok){ART[key]=im;ART_STATUS.loaded=Object.keys(ART).length;ART_STATUS.errors=ART_STATUS.errors.filter(k=>k!==key);}
      else if(!ART_STATUS.errors.includes(key))ART_STATUS.errors.push(key);
      ART_STATUS.pending.delete(key);resolve(ok);
    };
    const timer=setTimeout(()=>finish(false),15000);
    im.onload=()=>finish(true);im.onerror=()=>finish(false);im.src=ASSET_DATA[key];
  });

}

    if(topScreen()!==origin||scene!==originScene)return;
    if(!ready){toast('画面暂未载入，请稍后重试。',UIC.rose);return;}
    await openScreen(new ComicScreen(key));
    if(!replay){if(!Array.isArray(G.comics))G.comics=[];if(!G.comics.includes(key))G.comics.push(key);save();}
  } finally { comicActive=false; }
}

  if(!artKeys.every(k=>ART[k])&&!(await ensureStoryArt(artKeys))){toast('房间画面暂未载入，请稍后重试。',UIC.rose);return;}
  if(request!==interiorRequest||G!==state||topScreen()||scene!=='world'||scriptRunning||G.done<room.zone||Math.hypot(player.x-start.x,player.y-start.y)>4)return;

  return { key, name: r.name, avatar: r.avatar, fallbackAvatar: r.fallbackAvatar, role: r.role, bio: r.bio, outfit: r.outfit, zoneHint: r.zoneHint };
}
function registerResidentVoices() {
  Object.entries(RESIDENTS).forEach(([key, r], i) => {
    const id = typeof CHAR !== 'undefined' && CHAR[r.avatar] ? r.avatar : r.fallbackAvatar;
    const base = Object.values(WHO).find(w => w.id === r.fallbackAvatar) || WHO.me;
    WHO['resident_' + key] = { n: r.name, id, c: base.c, v: (i + 2) % 10 };
  });
}
function residentConversation(key, visit = 0, progress = 0) {
  const r = RESIDENTS[key]; if (!r) return [];
  const pool = progress >= r.afterAt && r.after.length ? r.after : r.lines;
  const index = Math.max(0, Math.floor(Number.isFinite(visit) ? visit : 0)) % pool.length;
  return pool[index].map(line => {
    const speech = [line.who === 'self' ? 'resident_' + key : line.who, line.text];
    if (line.emotion) speech.push('', { emotion: line.emotion });
    return speech;
  });
}
async function talkResident(key) {
  const r = RESIDENTS[key]; if (!r) return false;
  registerResidentVoices();
  if (!G.residentVisits || typeof G.residentVisits !== 'object' || Array.isArray(G.residentVisits)) G.residentVisits = {};
  const phase = G.done >= r.afterAt ? 'after' : 'before', slot = key + ':' + phase;
  const visit = Number.isSafeInteger(G.residentVisits[slot]) && G.residentVisits[slot] >= 0 ? G.residentVisits[slot] : 0;
  await talk(residentConversation(key, visit, G.done));
  G.residentVisits[slot] = visit + 1;
  save();
  return true;
}

function goalText() {
  const d = G.done;
  if (d === 0) return '听听鸭老师的委托';

async function complete(i) {
  G.done = i + 1; save(true);
  const w = walls.find(w => w.zone === i);
  if (w) {
    Audio.sfx('wall'); shake(4);
    for (let y = 4 * TILE; y < 26 * TILE; y += 6) burst(w.x + 8, y, 3, { colors: ['#ff2fa0', '#22e6d0', '#ffffff', '#b07aff'], min: 20, max: 120, life: 1.2, size: 2, glow: true });
    toast('乱码墙消失了！往右走 →');
  }
  if (BOSS_ZONES[i]) Audio.play(zoneMusic(curZone));
  if (BOSS_LIST.includes(i)) {
    const h = REGIONS[regionOf(i)].hat;
    if (!G.hats.includes(h)) G.hats.push(h);
    G.hat = h; appNew = true; save();
    Audio.sfx('jingle');
    await talk([['xa', `收到一顶${HATS[h].n}。看看点单页现在能做什么了。`]]);
    await openApp(true);
  }
}

async function bossFight(cfg, pre, post) {
  Audio.play(''); Audio.sfx('roar'); shake(8); flash(BOSS_BG[cfg.kind][2], .5);
  await wait(500);
  await talk(pre);
  flash('#ffffff', 1); Audio.sfx('warp'); await wait(300);
  Audio.play(cfg.kind === 'final' ? 'final' : 'battle', .2);
  const clean = await openScreen(new BattleScreen(cfg));
  if (clean) unlock('nohit');
  const n = npcs.find(n => n.boss === cfg.kind);
  Audio.play(cfg.kind === 'final' ? 'dawn' : REGIONS[regionOf(n ? n.id : 0)].music, 1.5); flash('#ffffff', 1);
  if (n) { burst(n.x, n.y - 30, 60, { colors: ['#ffffff', '#ffd23f', BOSS_BG[cfg.kind][2]], min: 30, max: 160, life: 1.4, size: 2, glow: true }); }
  await wait(500);
  await talk(post);
}

/* ---------- 主循环 ---------- */
let lastT = performance.now();
function frame(now) {
