<title>代码村大冒险</title>
<style>
/* 单一视觉世界：深夜紫的游戏机外框，像素画面居中铺满 */
:root { --bg: #0b0912; --ink: #f4e9cc; --gold: #ffd23f; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; display: grid; place-items: center; }
#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
#touch { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; }
#touch button { position: fixed; pointer-events: auto; touch-action: none; border: 3px solid rgba(244,233,204,.55); background: rgba(22,18,40,.42); color: rgba(244,233,204,.9); font: 700 18px/1 system-ui, sans-serif; display: grid; place-items: center; padding: 0; -webkit-user-select: none; user-select: none; }
#touch button.on { background: rgba(255,210,63,.6); color: #1a1222; }
#touch .d { width: 52px; height: 52px; border-radius: 10px; }
#touch [data-k=up] { left: calc(16px + env(safe-area-inset-left) + 54px); bottom: calc(16px + env(safe-area-inset-bottom) + 108px); }
#touch [data-k=down] { left: calc(16px + env(safe-area-inset-left) + 54px); bottom: calc(16px + env(safe-area-inset-bottom)); }
#touch [data-k=left] { left: calc(16px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom) + 54px); }
#touch [data-k=right] { left: calc(16px + env(safe-area-inset-left) + 108px); bottom: calc(16px + env(safe-area-inset-bottom) + 54px); }
#touch [data-k=ok] { right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom) + 40px); width: 72px; height: 72px; border-radius: 50%; background: rgba(255,210,63,.75); color: #1a1222; border-color: rgba(26,18,34,.6); font-size: 24px; }
#touch [data-k=run] { right: calc(16px + env(safe-area-inset-right) + 84px); bottom: calc(16px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; font-size: 14px; }
#tin { position: fixed; display: none; opacity: 0; font-size: 16px; border: 0; padding: 0; margin: 0; background: transparent; color: transparent; caret-color: transparent; z-index: 5; }
@media (prefers-reduced-motion: reduce) { #touch button { transition: none; } }
</style>

 * 00 核心：工具函数、画布缩放、输入
 * ============================================================ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
const fbm = (x, y, s = 0) => vnoise(x, y, s) * .6 + vnoise(x * 2.1, y * 2.1, s + 7) * .3 + vnoise(x * 4.3, y * 4.3, s + 13) * .1;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 颜色 ---------- */
const RGB_CACHE = new Map();
function hex2rgb(h) {
  let v = RGB_CACHE.get(h);
  if (!v) { const n = parseInt(h.slice(1, 7), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; RGB_CACHE.set(h, v); }
  return v;
}
const rgb2hex = (r, g, b) => '#' + ((1 << 24) | (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255)).toString(16).slice(1);
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function shade(c, f) { const A = hex2rgb(c); return rgb2hex(A[0] * f, A[1] * f, A[2] * f); }
const rgba = (c, a) => { const A = hex2rgb(c); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };
function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x];
}
function flipH(src) { const [c, x] = makeCanvas(src.width, src.height); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c; }

/* ---------- 画布 & 缩放 ---------- */
const cv = $('#game');
let ctx = cv.getContext('2d');
let VW = 480, VH = 270, SCALE = 1, PORTRAIT = false, TOUCH = false;
const resizeHooks = [];
function resize() {
  const w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
  PORTRAIT = h > w * 1.08;
  // 先按设备像素取整数倍放大（像素最清楚），再让画面尽量铺满屏幕
  const W = w * dpr, H = h * dpr, base = PORTRAIT ? [270, 480] : [480, 270], lim = PORTRAIT ? [260, 360, 400, 720] : [420, 600, 250, 340];
  let k = Math.floor(Math.min(W / base[0], H / base[1])), s = 1;
  if (k >= 1) { VW = clamp(Math.floor(W / k), lim[0], lim[1]); VH = clamp(Math.floor(H / k), lim[2], lim[3]); s = k / dpr; if (VW * s < w * .85 && VH * s < h * .85) k = 0; }
  if (k < 1) {
    if (PORTRAIT) { VW = 270; VH = clamp(Math.round(270 * h / w), lim[2], lim[3]); } else { VH = 270; VW = clamp(Math.round(270 * w / h), lim[0], lim[1]); }
    s = Math.min(w / VW, h / VH);
  }
  if (VW * s > w + .5 || VH * s > h + .5) s = Math.min(w / VW, h / VH);
  SCALE = s;
  cv.width = VW; cv.height = VH;
  cv.style.width = (VW * s) + 'px'; cv.style.height = (VH * s) + 'px';
  ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  resizeHooks.forEach(f => f());
}

const KEYS = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'ok', Enter: 'ok', NumpadEnter: 'ok', KeyZ: 'ok', KeyJ: 'ok',
  Escape: 'back', KeyX: 'back', KeyK: 'back', Backspace: 'back',
  KeyC: 'note', Tab: 'note', KeyM: 'mute', ShiftLeft: 'run', ShiftRight: 'run',
};
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const a = KEYS[e.code]; if (!a) return;
  e.preventDefault();
  Input.device = 'kb';
  if (!e.repeat) Input.pressed.add(a);
  Input.held[a] = true;
  Audio.unlock();
});
window.addEventListener('keyup', e => { const a = KEYS[e.code]; if (a) Input.held[a] = false; });
window.addEventListener('blur', () => { for (const k in Input.held) Input.held[k] = false; });
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; }
cv.addEventListener('pointermove', e => { const p = toGame(e); Input.pointer.x = p.x; Input.pointer.y = p.y; Input.pointer.moved = true; if (e.pointerType === 'mouse') Input.device = 'mouse'; });
cv.addEventListener('pointerdown', e => {
  const p = toGame(e); Input.pointer.x = p.x; Input.pointer.y = p.y; Input.pointer.click = p;
  Input.device = e.pointerType === 'mouse' ? 'mouse' : 'touch';
  if (e.pointerType !== 'mouse') TOUCH = true;
  Audio.unlock();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
// iPhone 只认 touchend / click 这类"真正的点击"来解锁声音，多挂几个保险
['touchend', 'click', 'pointerup', 'keydown'].forEach(ev => window.addEventListener(ev, () => Audio.unlock(), { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) Audio.unlock(); });

/* 触屏按键 */
function setupTouch() {
  const box = $('#touch');
  document.querySelectorAll('#touch [data-k]').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); TOUCH = true; Input.device = 'touch'; Input.held[k] = true; Input.pressed.add(k); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} Audio.unlock(); };
    const off = () => { Input.held[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, off));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  if (matchMedia('(pointer:coarse)').matches) TOUCH = true;
  return box;
}

const OUTLINE = '#1a1222';

    R(x, y, ww, hh, c) { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) api.P(x + i, y + j, c); },
    E(cx, cy, rx, ry, c) { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) api.P(x, y, c); } },
    G(x, y) { return (x >= 0 && y >= 0 && x < w && y < h) ? buf[y * w + x] : null; },
    X(x, y) { if (x >= 0 && y >= 0 && x < w && y < h) buf[y * w + x] = null; },
    L(x0, y0, x1, y1, c) { x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0; const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (;;) { api.P(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } },
    // 在已有像素上做明暗：只改已经画了的像素
    T(x, y, c) { if (api.G(x, y)) api.P(x, y, c); },
  };
  fn(api);

  const [c, x] = makeCanvas(W, H); const img = x.createImageData(W, H), d = img.data;
  const put = (px, py, col) => { const [r, g, b] = hex2rgb(col); const i = (py * W + px) * 4; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255; };
  for (let y = 0; y < h; y++) for (let x2 = 0; x2 < w; x2++) if (buf[y * w + x2]) put(x2 + pad, y + pad, buf[y * w + x2]);
  if (outline) {

    for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) {

}

const screens = [];

class Screen {
  constructor() { this.btns = []; this.focus = 0; this.t = 0; this.dim = 0; }
  nav() {
    const B = this.btns.filter(b => !b.disabled && !b.hidden);
    const p = Input.pointer;
    if (p.moved && Input.device === 'mouse') { const i = this.btns.findIndex(b => !b.disabled && !b.hidden && b.hit(p)); if (i >= 0 && i !== this.focus) { this.focus = i; } }
    if (p.click) { const i = this.btns.findIndex(b => !b.disabled && !b.hidden && b.hit(p.click)); if (i >= 0) { this.focus = i; Audio.sfx('select'); this.press(this.btns[i]); return true; } }
    if (!B.length) return false;
    let cur = this.btns[this.focus];
    if (!cur || cur.disabled || cur.hidden) { this.focus = this.btns.indexOf(B[0]); cur = B[0]; }

      if (!Input.hit(d)) continue;

      for (const b of B) {
        if (b === cur) continue;
        const dx = b.cx - cur.cx, dy = b.cy - cur.cy, along = dx * vx + dy * vy;
        if (along <= 2) continue;
        const across = Math.abs(dx * vy) + Math.abs(dy * vx), score = along + across * 2.2;
        if (score < bd) { bd = score; best = b; }
      }
      if (!best && (vy !== 0)) { const ordered = B.slice(); const i = ordered.indexOf(cur); best = ordered[(i + vy + ordered.length) % ordered.length]; }
      if (best) { this.focus = this.btns.indexOf(best); Audio.sfx('move'); }
    }
    if (Input.hit('ok')) { Audio.sfx('select'); this.press(this.btns[this.focus]); return true; }
    return false;
  }
  press(b) { if (b && !b.disabled && b.onPress) b.onPress(b); }
  drawBtns(g) { this.btns.forEach((b, i) => { if (!b.hidden) b.draw(g, i === this.focus && (Input.device !== 'touch'), this.t); }); }
  dimBg(g, a = .55) { g.fillStyle = `rgba(8,6,20,${a})`; g.fillRect(0, 0, VW, VH); }
}

class DialogScreen extends Screen {

async function complete(i) {
  G.done = i + 1; save(true);
  const w = walls.find(w => w.zone === i);
  if (w) {
    Audio.sfx('wall'); shake(4);
    for (let y = 4 * TILE; y < 26 * TILE; y += 6) burst(w.x + 8, y, 3, { colors: ['#ff2fa0', '#22e6d0', '#ffffff', '#b07aff'], min: 20, max: 120, life: 1.2, size: 2, glow: true });
    toast('乱码墙消失了！往右走 →');
  }
  if (BOSS_ZONES[i]) Audio.play(zoneMusic(curZone));
  if (BOSS_LIST.includes(i)) {
    const h = REGIONS[regionOf(i)].hat;
    if (!G.hats.includes(h)) G.hats.push(h);
    G.hat = h; appNew = true; save();
    Audio.sfx('jingle');
    await talk([['xa', `我得到了一顶${HATS[h].n}！好看吗？（暂停菜单里能给我换帽子）`], ['xa', '快看手机！鸭鸭点餐 App 升级了！']]);
    await openApp(true);
  }
}

async function bossFight(cfg, pre, post) {
  Audio.play(''); Audio.sfx('roar'); shake(8); flash(BOSS_BG[cfg.kind][2], .5);
  await wait(500);
  await talk(pre);
  flash('#ffffff', 1); Audio.sfx('warp'); await wait(300);
  Audio.play(cfg.kind === 'final' ? 'final' : 'battle', .2);
  const clean = await openScreen(new BattleScreen(cfg));
  if (clean) unlock('nohit');
  const n = npcs.find(n => n.boss === cfg.kind);
  Audio.play(cfg.kind === 'final' ? 'dawn' : REGIONS[regionOf(n ? n.id : 0)].music, 1.5); flash('#ffffff', 1);
  if (n) { burst(n.x, n.y - 30, 60, { colors: ['#ffffff', '#ffd23f', BOSS_BG[cfg.kind][2]], min: 30, max: 160, life: 1.4, size: 2, glow: true }); }
  await wait(500);
  await talk(post);
}

  else if (scene === 'world' && !scriptRunning) worldInput();
  if (scene === 'world' || scene === 'title') {
    if (scene === 'title') { worldT += 0; cam.x = (Math.sin(now / 90000) * .5 + .5) * (MAPW - VW); cam.y = VH >= MAPH ? (MAPH - VH) / 2 : (MAPH - VH) / 2; }
    updateWorld(dt, scene === 'world' && !top && !scriptRunning);
    if (scene === 'title') { cam.x = (Math.sin(now / 90000) * .5 + .5) * (MAPW - VW); cam.y = VH >= MAPH ? (MAPH - VH) / 2 : (MAPH - VH) / 2; }
    if (scene === 'world' && !top) { G.t += dt; if (!scriptRunning) autoSave(dt); }
  } else updateParts(dt);
  fx.shake = Math.max(0, fx.shake - dt * 18); fx.flash = Math.max(0, fx.flash - dt * 2.5);
  // —— 绘制 ——
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (scene === 'world' || scene === 'title') drawWorld(ctx, dt);
  else if (scene === 'intro' || scene === 'ending') drawRoom(ctx, dt);
  else { ctx.fillStyle = '#0b0912'; ctx.fillRect(0, 0, VW, VH); }
  if (scene === 'world' && worldReady) { drawHUD(ctx, dt); if (!top && !scriptRunning) drawPrompt(ctx); else promptTarget = null; }
  for (const s of screens) s.draw(ctx);
  drawParts(ctx, 0, 0, 'ui');
  drawToasts(ctx, dt);
  if (fx.flash > 0) { ctx.globalAlpha = Math.min(1, fx.flash); ctx.fillStyle = fx.flashC; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
  if (fx.fade > 0) { ctx.globalAlpha = fx.fade; ctx.fillStyle = fx.fadeC; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
  if (touchBox) touchBox.hidden = !(TOUCH && scene === 'world' && !top && !scriptRunning);
  Input.endFrame();
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
async function boot() {
  resize(); window.addEventListener('resize', resize);
  touchBox = setupTouch();
  try { const ff = new FontFace('FusionPixel', `url(data:font/woff2;base64,${FONT_DATA})`); await ff.load(); document.fonts.add(ff); } catch (e) { console.warn('font', e); }
  CW.clear();
  buildProps(); buildIcons(); buildProps3(); buildIcons3(); aliasIcons(); initClouds();
  requestAnimationFrame(frame);
  setTimeout(() => {
    buildWorld(); setupNPCs();
    lights.push({ x: (26 * ZW + 12.5) * TILE, y: 12 * TILE - 40, r: 110, c: '#ffe0a0', always: true });
    lights.push({ x: (25 * ZW + 12.5) * TILE, y: 12 * TILE - 30, r: 110, c: '#ff3aa8', always: true, flicker: .1 });
    worldReady = true;
  }, 60);
  await openScreen(new BootScreen(() => worldReady));
  goTitle();
}
window.__game = { get G() { return G; }, get scene() { return scene; }, get screens() { return screens; }, player, npcs, CH, walls, get scriptRunning() { return scriptRunning; }, Audio, enterWorld, setG(v) { G = v; }, TERMS, HIDDEN, ACH, ARCH, NZ, ZW, TILE, interact, get curZone() { return curZone; } };
boot();

})();
</script>
